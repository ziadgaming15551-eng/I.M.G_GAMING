<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
  body, html { margin: 0; padding: 0; overflow: hidden; background: #e0f2fe; font-family: sans-serif; user-select: none; }
  #game-container { position: relative; width: 100%; height: 500px; max-width: 800px; margin: auto; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
  #score-board { position: absolute; top: 15px; right: 20px; font-size: 22px; font-weight: bold; color: #0f172a; background: rgba(255,255,255,0.85); padding: 8px 16px; border-radius: 20px; z-index: 10; }
  #controls { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: space-between; padding: 0 30px; box-sizing: border-box; z-index: 10; }
  .ctrl-btn { width: 70px; height: 70px; background: rgba(255, 255, 255, 0.85); border: 2px solid #0284c7; border-radius: 50%; font-size: 28px; color: #0284c7; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; touch-action: manipulation; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
  .ctrl-btn:active { background: #0284c7; color: #ffffff; transform: scale(0.95); }
  #game-over, #lock-screen { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.95); flex-direction: column; align-items: center; justify-content: center; z-index: 30; text-align: center; padding: 20px; box-sizing: border-box; }
  #restart-btn { margin-top: 15px; padding: 12px 28px; font-size: 18px; background: #0284c7; color: white; border: none; border-radius: 25px; cursor: pointer; font-weight: bold; }
</style>
</head>
<body>

<div id="game-container">
  <div id="lock-screen">
    <h2 style="color:#e11d48; margin:0 0 10px 0;">⛔ هذه اللعبة حصرية</h2>
    <p style="font-size:18px; color:#334155;">لا يمكن تشغيل هذه اللعبة إلا من خلال موقع <b>I.M.G GAMING</b> الرسمي فقط.</p>
  </div>
  <div id="score-board">النقاط: 0</div>
  <div id="game-over">
    <h2 style="color:#0f172a; margin:0;">انتهت اللعبة!</h2>
    <p id="final-score" style="font-size:20px; color:#334155;"></p>
    <button id="restart-btn" onclick="resetGame()">العب مرة أخرى</button>
  </div>
  <div id="controls">
    <button class="ctrl-btn" id="btn-left">◀</button>
    <button class="ctrl-btn" id="btn-jump">▲</button>
    <button class="ctrl-btn" id="btn-right">▶</button>
  </div>
</div>

<script src="https://cloudflare.com"></script>
<script>
  const allowedDomain = "://blogspot.com";
  const parentUrl = document.referrer;
  
  if (window.self === window.top || !parentUrl.includes(allowedDomain)) {
    document.getElementById('lock-screen').style.display = 'flex';
    throw new Error("Game locked to I.M.G GAMING only.");
  }

  const container = document.getElementById('game-container');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xe0f2fe);
  scene.fog = new THREE.Fog(0xe0f2fe, 10, 50);

  const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 100);
  camera.position.set(0, 4, 8);
  camera.lookAt(0, 1, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  container.appendChild(renderer.domElement);

  const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
  scene.add(ambientLight);
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
  dirLight.position.set(5, 10, 7);
  scene.add(dirLight);

  const roadGeo = new THREE.PlaneGeometry(8, 200);
  const roadMat = new THREE.MeshLambertMaterial({ color: 0xf8fafc });
  const road = new THREE.Mesh(roadGeo, roadMat);
  road.rotation.x = -Math.PI / 2;
  scene.add(road);

  const playerGeo = new THREE.BoxGeometry(1, 1, 1);
  const playerMat = new THREE.MeshLambertMaterial({ color: 0x0284c7 });
  const player = new THREE.Mesh(playerGeo, playerMat);
  player.position.set(0, 0.5, 2);
  scene.add(player);

  let lanes = [-2.5, 0, 2.5];
  let currentLane = 1;
  let isJumping = false;
  let jumpVel = 0;
  let obstacles = [];
  let score = 0;
  let speed = 0.25;
  let isGameOver = false;

  function spawnObstacle() {
    if (isGameOver) return;
    const obsGeo = new THREE.BoxGeometry(1.2, 1.2, 1.2);
    const obsMat = new THREE.MeshLambertMaterial({ color: 0xf43f5e });
    const obs = new THREE.Mesh(obsGeo, obsMat);
    const randomLane = lanes[Math.floor(Math.random() * lanes.length)];
    obs.position.set(randomLane, 0.6, -45);
    scene.add(obs);
    obstacles.push(obs);
  }

  setInterval(spawnObstacle, 1100);

  document.getElementById('btn-left').addEventListener('touchstart', (e) => { e.preventDefault(); moveLeft(); });
  document.getElementById('btn-left').addEventListener('click', moveLeft);
  document.getElementById('btn-right').addEventListener('touchstart', (e) => { e.preventDefault(); moveRight(); });
  document.getElementById('btn-right').addEventListener('click', moveRight);
  document.getElementById('btn-jump').addEventListener('touchstart', (e) => { e.preventDefault(); jump(); });
  document.getElementById('btn-jump').addEventListener('click', jump);

  function moveLeft() { if (currentLane > 0 && !isGameOver) currentLane--; }
  function moveRight() { if (currentLane < 2 && !isGameOver) currentLane++; }
  function jump() { if (!isJumping && !isGameOver) { isJumping = true; jumpVel = 0.22; } }

  function resetGame() {
    obstacles.forEach(o => scene.remove(o));
    obstacles = [];
    score = 0;
    speed = 0.25;
    currentLane = 1;
    player.position.set(0, 0.5, 2);
    isGameOver = false;
    document.getElementById('score-board').innerText = 'النقاط: 0';
    document.getElementById('game-over').style.display = 'none';
  }

  function animate() {
    requestAnimationFrame(animate);
    if (!isGameOver) {
      player.position.x += (lanes[currentLane] - player.position.x) * 0.2;

      if (isJumping) {
        player.position.y += jumpVel;
        jumpVel -= 0.012;
        if (player.position.y <= 0.5) {
          player.position.y = 0.5;
          isJumping = false;
        }
      }

      for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        obs.position.z += speed;

        if (Math.abs(obs.position.z - player.position.z) < 0.9 &&
            Math.abs(obs.position.x - player.position.x) < 0.9 &&
            player.position.y < 1.3) {
          isGameOver = true;
          document.getElementById('final-score').innerText = 'مجموع نقاطك: ' + score;
          document.getElementById('game-over').style.display = 'flex';
        }

        if (obs.position.z > 10) {
          scene.remove(obs);
          obstacles.splice(i, 1);
          score += 10;
          speed += 0.002;
          document.getElementById('score-board').innerText = 'النقاط: ' + score;
        }
      }
    }
    renderer.render(scene, camera);
  }
  animate();
</script>
</body>
</html>
